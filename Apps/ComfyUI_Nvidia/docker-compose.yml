name: comfyui_nvidia
services:
  comfyui_nvidia:
    image: ghcr.io/nimotech/comfyui:cu126-megapak-20260803
    container_name: comfyui-nvidia
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    environment:
      CLI_ARGS: ''
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
    - target: 8188
      published: '28188'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/storage
      target: /root
    - type: bind
      source: /DATA/AppData/$AppID/models
      target: /root/ComfyUI/models
    - type: bind
      source: /DATA/AppData/$AppID/input
      target: /root/ComfyUI/input
    - type: bind
      source: /DATA/AppData/$AppID/output
      target: /root/ComfyUI/output
    restart: unless-stopped
    x-casaos:
      envs:
      - container: CLI_ARGS
        description:
          de_DE: Zusätzliche ComfyUI-Startargumente
          el_GR: Πρόσθετα ορίσματα εκκίνησης ComfyUI
          en_GB: Extra ComfyUI launch arguments
          en_US: Extra ComfyUI launch arguments
          fr_FR: Arguments de lancement ComfyUI supplémentaires
          hr_HR: Dodatni argumenti pokretanja ComfyUI
          it_IT: Argomenti di avvio ComfyUI aggiuntivi
          ja_JP: ComfyUIの追加起動引数
          ko_KR: ComfyUI 추가 실행 인수
          nb_NO: Ekstra ComfyUI-oppstartsargumenter
          pt_PT: Argumentos de arranque adicionais do ComfyUI
          ru_RU: Дополнительные аргументы запуска ComfyUI
          sv_SE: Extra ComfyUI-startargument
          tr_TR: Ek ComfyUI başlatma argümanları
          zh_CN: ComfyUI 额外启动参数
      - container: NVIDIA_VISIBLE_DEVICES
        description:
          de_DE: Sichtbare NVIDIA-Geräte für GPU-Beschleunigung
          el_GR: Ορατές συσκευές NVIDIA για επιτάχυνση GPU
          en_GB: Visible NVIDIA devices for GPU acceleration
          en_US: Visible NVIDIA devices for GPU acceleration
          fr_FR: Appareils NVIDIA visibles pour l'accélération GPU
          hr_HR: Vidljivi NVIDIA uređaji za GPU ubrzanje
          it_IT: Dispositivi NVIDIA visibili per l'accelerazione GPU
          ja_JP: GPUアクセラレーション用の可視NVIDIAデバイス
          ko_KR: GPU 가속을 위한 가시적 NVIDIA 장치
          nb_NO: Synlige NVIDIA-enheter for GPU-akselerasjon
          pt_PT: Dispositivos NVIDIA visíveis para aceleração de GPU
          ru_RU: Видимые устройства NVIDIA для ускорения GPU
          sv_SE: Synliga NVIDIA-enheter för GPU-acceleration
          tr_TR: GPU hızlandırması için görünür NVIDIA cihazları
          zh_CN: 用于GPU加速的可见NVIDIA设备
      - container: NVIDIA_DRIVER_CAPABILITIES
        description:
          de_DE: NVIDIA-Treiberfähigkeiten
          el_GR: Δυνατότητες οδηγού NVIDIA
          en_GB: NVIDIA driver capabilities
          en_US: NVIDIA driver capabilities
          fr_FR: Capacités du pilote NVIDIA
          hr_HR: NVIDIA mogućnosti upravljačkog programa
          it_IT: Capacità del driver NVIDIA
          ja_JP: NVIDIAドライバー機能
          ko_KR: NVIDIA 드라이버 기능
          nb_NO: NVIDIA driverkapabiliteter
          pt_PT: Capacidades do driver NVIDIA
          ru_RU: Возможности драйвера NVIDIA
          sv_SE: NVIDIA-drivrutinskapaciteter
          tr_TR: NVIDIA sürücü yetenekleri
          zh_CN: NVIDIA驱动程序功能
      ports:
      - container: '8188'
        description:
          de_DE: ComfyUI Web-UI-Port
          el_GR: Θύρα web διεπαφής ComfyUI
          en_GB: ComfyUI web interface port
          en_US: ComfyUI web interface port
          fr_FR: Port de l'interface web ComfyUI
          hr_HR: Port web sučelja ComfyUI
          it_IT: Porta dell'interfaccia web ComfyUI
          ja_JP: ComfyUI Webインターフェースポート
          ko_KR: ComfyUI 웹 인터페이스 포트
          nb_NO: ComfyUI web-grensesnittport
          pt_PT: Porta da interface web ComfyUI
          ru_RU: Порт веб-интерфейса ComfyUI
          sv_SE: ComfyUI webbgränssnittsport
          tr_TR: ComfyUI web arayüzü portu
          zh_CN: ComfyUI Web 界面端口
      volumes:
      - container: /root
        description:
          de_DE: Anwendungsspeicher (ComfyUI-Umgebung, Custom Nodes, Einstellungen)
          el_GR: Αποθήκευση εφαρμογής (περιβάλλον ComfyUI, custom nodes, ρυθμίσεις)
          en_GB: Application storage (ComfyUI environment, custom nodes, settings)
          en_US: Application storage (ComfyUI environment, custom nodes, settings)
          fr_FR: Stockage de l'application (environnement ComfyUI, custom nodes, réglages)
          hr_HR: Pohrana aplikacije (ComfyUI okruženje, custom čvorovi, postavke)
          it_IT: Spazio dell'applicazione (ambiente ComfyUI, custom node, impostazioni)
          ja_JP: アプリケーションストレージ(ComfyUI環境、カスタムノード、設定)
          ko_KR: 애플리케이션 저장소(ComfyUI 환경, 커스텀 노드, 설정)
          nb_NO: Applikasjonslagring (ComfyUI-miljø, egendefinerte noder, innstillinger)
          pt_PT: Armazenamento da aplicação (ambiente ComfyUI, custom nodes, definições)
          ru_RU: Хранилище приложения (окружение ComfyUI, пользовательские узлы, настройки)
          sv_SE: Programlagring (ComfyUI-miljö, egna noder, inställningar)
          tr_TR: Uygulama depolama alanı (ComfyUI ortamı, özel düğümler, ayarlar)
          zh_CN: 应用存储(ComfyUI 环境、自定义节点、设置)
      - container: /root/ComfyUI/models
        description:
          de_DE: Modelldateien (Checkpoints, LoRAs, VAE, Upscaler)
          el_GR: Αρχεία μοντέλων (checkpoints, LoRA, VAE, upscalers)
          en_GB: Model files (checkpoints, LoRAs, VAE, upscalers)
          en_US: Model files (checkpoints, LoRAs, VAE, upscalers)
          fr_FR: Fichiers de modèles (checkpoints, LoRA, VAE, upscalers)
          hr_HR: Datoteke modela (checkpointovi, LoRA, VAE, upscaleri)
          it_IT: File dei modelli (checkpoint, LoRA, VAE, upscaler)
          ja_JP: モデルファイル(チェックポイント、LoRA、VAE、アップスケーラー)
          ko_KR: 모델 파일(체크포인트, LoRA, VAE, 업스케일러)
          nb_NO: Modellfiler (checkpoints, LoRA-er, VAE, oppskalere)
          pt_PT: Ficheiros de modelos (checkpoints, LoRAs, VAE, upscalers)
          ru_RU: Файлы моделей (чекпоинты, LoRA, VAE, апскейлеры)
          sv_SE: Modellfiler (checkpoints, LoRA, VAE, uppskalare)
          tr_TR: Model dosyaları (checkpoint'ler, LoRA'lar, VAE, upscaler'lar)
          zh_CN: 模型文件(底模、LoRA、VAE、放大模型)
      - container: /root/ComfyUI/input
        description:
          de_DE: Eingabebilder und -dateien
          el_GR: Εικόνες και αρχεία εισόδου
          en_GB: Input images and files
          en_US: Input images and files
          fr_FR: Images et fichiers d'entrée
          hr_HR: Ulazne slike i datoteke
          it_IT: Immagini e file di input
          ja_JP: 入力画像とファイル
          ko_KR: 입력 이미지 및 파일
          nb_NO: Inndatabilder og -filer
          pt_PT: Imagens e ficheiros de entrada
          ru_RU: Входные изображения и файлы
          sv_SE: Indatabilder och -filer
          tr_TR: Girdi görüntüleri ve dosyaları
          zh_CN: 输入图片与文件
      - container: /root/ComfyUI/output
        description:
          de_DE: Generierte Bilder und Videos
          el_GR: Παραγόμενες εικόνες και βίντεο
          en_GB: Generated images and videos
          en_US: Generated images and videos
          fr_FR: Images et vidéos générées
          hr_HR: Generirane slike i videozapisi
          it_IT: Immagini e video generati
          ja_JP: 生成された画像と動画
          ko_KR: 생성된 이미지와 비디오
          nb_NO: Genererte bilder og videoer
          pt_PT: Imagens e vídeos gerados
          ru_RU: Сгенерированные изображения и видео
          sv_SE: Genererade bilder och videor
          tr_TR: Oluşturulan görüntüler ve videolar
          zh_CN: 生成的图片与视频
x-casaos:
  title:
    de_DE: ComfyUI (Nvidia GPU)
    el_GR: ComfyUI (Nvidia GPU)
    en_GB: ComfyUI (Nvidia GPU)
    en_US: ComfyUI (Nvidia GPU)
    fr_FR: ComfyUI (Nvidia GPU)
    hr_HR: ComfyUI (Nvidia GPU)
    it_IT: ComfyUI (Nvidia GPU)
    ja_JP: ComfyUI (Nvidia GPU)
    ko_KR: ComfyUI (Nvidia GPU)
    nb_NO: ComfyUI (Nvidia GPU)
    pt_PT: ComfyUI (Nvidia GPU)
    ru_RU: ComfyUI (Nvidia GPU)
    sv_SE: ComfyUI (Nvidia GPU)
    tr_TR: ComfyUI (Nvidia GPU)
    zh_CN: ComfyUI (Nvidia GPU)
  tagline:
    de_DE: Die leistungsstärkste quelloffene, knotenbasierte Oberfläche für generative KI
    el_GR: Η πιο ισχυρή ανοιχτού κώδικα διεπαφή ροών εργασίας γενετικής AI βασισμένη σε κόμβους
    en_GB: The most powerful open-source, node-based interface for generative AI
    en_US: The most powerful open-source, node-based interface for generative AI
    fr_FR: L'interface nodale open source la plus puissante pour l'IA générative
    hr_HR: Najmoćnije open-source sučelje za generativni AI temeljeno na čvorovima
    it_IT: La più potente interfaccia open source a nodi per l'IA generativa
    ja_JP: 最も強力なオープンソースのノードベース生成AIインターフェース
    ko_KR: 가장 강력한 오픈소스 노드 기반 생성형 AI 인터페이스
    nb_NO: Det kraftigste åpen kildekode, nodebaserte grensesnittet for generativ KI
    pt_PT: A interface nodal open source mais poderosa para IA generativa
    ru_RU: Самый мощный открытый узловой интерфейс для генеративного ИИ
    sv_SE: Det kraftfullaste nodbaserade gränssnittet med öppen källkod för generativ AI
    tr_TR: Üretken yapay zekâ için en güçlü açık kaynaklı, düğüm tabanlı arayüz
    zh_CN: 最强大的开源节点式生成式 AI 工作流界面
  description:
    de_DE: |-
      ComfyUI ist eine leistungsstarke, modulare, knotenbasierte Oberfläche für generative KI. Erstellen Sie Bild-, Video- und Audio-Pipelines visuell als Graphen, nutzen Sie Community-Workflows und erweitern Sie alles mit Custom Nodes.

      **Diese Edition:** beschleunigt auf NVIDIA-GPUs über CUDA 12.6, gebündelt mit 40+ beliebten Custom Nodes und Performance-Bibliotheken. Erfordert NVIDIA-Treiber und nvidia-container-toolkit auf dem Host.

      **Modelle:** Modelldateien unter `/DATA/AppData/comfyui_nvidia/models` ablegen (z. B. `checkpoints/`, `loras/`, `vae/`) und die Modellliste in der Web-UI aktualisieren.

      **Mehr erfahren:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker-Image](https://github.com/YanWenKun/ComfyUI-Docker)
    el_GR: |-
      Το ComfyUI είναι μια ισχυρή, αρθρωτή διεπαφή γενετικής AI βασισμένη σε κόμβους. Δημιουργήστε ροές παραγωγής εικόνας, βίντεο και ήχου οπτικά ως γράφους, επαναχρησιμοποιήστε workflows της κοινότητας και επεκτείνετε τα πάντα με custom nodes.

      **Αυτή η έκδοση:** επιταχύνεται σε NVIDIA GPU μέσω CUDA 12.6, με 40+ δημοφιλή custom nodes και βιβλιοθήκες απόδοσης. Απαιτεί driver NVIDIA και nvidia-container-toolkit στον host.

      **Μοντέλα:** τοποθετήστε τα αρχεία μοντέλων στο `/DATA/AppData/comfyui_nvidia/models` (π.χ. `checkpoints/`, `loras/`, `vae/`) και ανανεώστε τη λίστα μοντέλων στο web UI.

      **Μάθετε περισσότερα:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker image](https://github.com/YanWenKun/ComfyUI-Docker)
    en_GB: |-
      ComfyUI is a powerful, modular, node-based interface for generative AI. Build image, video and audio generation pipelines visually as graphs, reuse community workflows, and extend everything with custom nodes.

      **This edition:** accelerated on NVIDIA GPUs via CUDA 12.6, bundled with 40+ popular custom nodes and performance libraries. Requires the NVIDIA driver and nvidia-container-toolkit on the host.

      **Models:** put model files under `/DATA/AppData/comfyui_nvidia/models` (e.g. `checkpoints/`, `loras/`, `vae/`), then refresh the model list in the web UI.

      **Learn more:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker image](https://github.com/YanWenKun/ComfyUI-Docker)
    en_US: |-
      ComfyUI is a powerful, modular, node-based interface for generative AI. Build image, video and audio generation pipelines visually as graphs, reuse community workflows, and extend everything with custom nodes.

      **This edition:** accelerated on NVIDIA GPUs via CUDA 12.6, bundled with 40+ popular custom nodes and performance libraries. Requires the NVIDIA driver and nvidia-container-toolkit on the host.

      **Models:** put model files under `/DATA/AppData/comfyui_nvidia/models` (e.g. `checkpoints/`, `loras/`, `vae/`), then refresh the model list in the web UI.

      **Learn more:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker image](https://github.com/YanWenKun/ComfyUI-Docker)
    fr_FR: |-
      ComfyUI est une interface nodale puissante et modulaire pour l'IA générative. Construisez visuellement des pipelines d'images, de vidéo et d'audio sous forme de graphes, réutilisez les workflows de la communauté et étendez tout avec des custom nodes.

      **Cette édition :** accéléré sur les GPU NVIDIA via CUDA 12.6, livré avec plus de 40 custom nodes populaires et des bibliothèques de performance. Nécessite le pilote NVIDIA et nvidia-container-toolkit sur l'hôte.

      **Modèles :** placez les fichiers de modèles dans `/DATA/AppData/comfyui_nvidia/models` (p. ex. `checkpoints/`, `loras/`, `vae/`), puis actualisez la liste des modèles dans l'interface web.

      **En savoir plus :** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Image Docker](https://github.com/YanWenKun/ComfyUI-Docker)
    hr_HR: |-
      ComfyUI je moćno, modularno sučelje za generativni AI temeljeno na čvorovima. Vizualno gradite cjevovode za generiranje slika, videa i zvuka kao grafove, koristite workflowove zajednice i proširujte sve custom čvorovima.

      **Ovo izdanje:** ubrzano na NVIDIA GPU-ima putem CUDA 12.6, s uključenih 40+ popularnih custom čvorova i performansnih biblioteka. Zahtijeva NVIDIA upravljački program i nvidia-container-toolkit na domaćinu.

      **Modeli:** datoteke modela stavite u `/DATA/AppData/comfyui_nvidia/models` (npr. `checkpoints/`, `loras/`, `vae/`), zatim osvježite popis modela u web sučelju.

      **Saznajte više:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker slika](https://github.com/YanWenKun/ComfyUI-Docker)
    it_IT: |-
      ComfyUI è un'interfaccia a nodi potente e modulare per l'IA generativa. Costruisci visivamente pipeline di generazione di immagini, video e audio come grafi, riutilizza i workflow della community ed estendi tutto con custom node.

      **Questa edizione:** accelerato su GPU NVIDIA tramite CUDA 12.6, con oltre 40 custom node popolari e librerie di performance. Richiede driver NVIDIA e nvidia-container-toolkit sull'host.

      **Modelli:** metti i file dei modelli in `/DATA/AppData/comfyui_nvidia/models` (es. `checkpoints/`, `loras/`, `vae/`), poi aggiorna l'elenco modelli nella web UI.

      **Scopri di più:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Immagine Docker](https://github.com/YanWenKun/ComfyUI-Docker)
    ja_JP: |-
      ComfyUIは、強力でモジュール式のノードベース生成AIインターフェースです。画像・動画・音声の生成パイプラインをグラフとして視覚的に構築し、コミュニティのワークフローを再利用し、カスタムノードで自由に拡張できます。

      **このエディション:**CUDA 12.6によりNVIDIA GPUで高速化。40以上の人気カスタムノードとパフォーマンスライブラリを同梱。ホストにNVIDIAドライバーとnvidia-container-toolkitが必要です。

      **モデル:**モデルファイルを `/DATA/AppData/comfyui_nvidia/models`(例:`checkpoints/`、`loras/`、`vae/`)に配置し、Web UIでモデルリストを更新してください。

      **詳細:**[ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Dockerイメージ](https://github.com/YanWenKun/ComfyUI-Docker)
    ko_KR: |-
      ComfyUI는 강력하고 모듈화된 노드 기반 생성형 AI 인터페이스입니다. 이미지·비디오·오디오 생성 파이프라인을 그래프로 시각적으로 구성하고, 커뮤니티 워크플로를 재사용하며, 커스텀 노드로 무한히 확장할 수 있습니다.

      **이 에디션:** CUDA 12.6을 통해 NVIDIA GPU에서 가속되며, 40개 이상의 인기 커스텀 노드와 성능 라이브러리가 포함되어 있습니다. 호스트에 NVIDIA 드라이버와 nvidia-container-toolkit이 필요합니다.

      **모델:** 모델 파일을 `/DATA/AppData/comfyui_nvidia/models`(예: `checkpoints/`, `loras/`, `vae/`)에 넣고 웹 UI에서 모델 목록을 새로고침하세요.

      **자세히 알아보기:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker 이미지](https://github.com/YanWenKun/ComfyUI-Docker)
    nb_NO: |-
      ComfyUI er et kraftig, modulært, nodebasert grensesnitt for generativ KI. Bygg pipeline for bilde-, video- og lydgenerering visuelt som grafer, gjenbruk fellesskapets arbeidsflyter og utvid alt med egendefinerte noder.

      **Denne utgaven:** akselerert på NVIDIA-GPU-er via CUDA 12.6, med 40+ populære egendefinerte noder og ytelsesbiblioteker. Krever NVIDIA-driver og nvidia-container-toolkit på verten.

      **Modeller:** legg modellfiler under `/DATA/AppData/comfyui_nvidia/models` (f.eks. `checkpoints/`, `loras/`, `vae/`), og oppdater modellisten i web-UI.

      **Les mer:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker-bilde](https://github.com/YanWenKun/ComfyUI-Docker)
    pt_PT: |-
      O ComfyUI é uma interface nodal poderosa e modular para IA generativa. Construa visualmente pipelines de geração de imagem, vídeo e áudio como grafos, reutilize workflows da comunidade e estenda tudo com custom nodes.

      **Esta edição:** acelerado em GPUs NVIDIA via CUDA 12.6, com mais de 40 custom nodes populares e bibliotecas de desempenho. Requer o driver NVIDIA e o nvidia-container-toolkit no host.

      **Modelos:** coloque os ficheiros de modelos em `/DATA/AppData/comfyui_nvidia/models` (p. ex. `checkpoints/`, `loras/`, `vae/`) e atualize a lista de modelos na interface web.

      **Saiba mais:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Imagem Docker](https://github.com/YanWenKun/ComfyUI-Docker)
    ru_RU: |-
      ComfyUI — мощный модульный узловой интерфейс для генеративного ИИ. Визуально собирайте конвейеры генерации изображений, видео и звука в виде графов, используйте готовые workflow сообщества и расширяйте всё пользовательскими узлами.

      **Эта редакция:** ускоряется на GPU NVIDIA через CUDA 12.6, в комплекте 40+ популярных пользовательских узлов и библиотек производительности. Требуются драйвер NVIDIA и nvidia-container-toolkit на хосте.

      **Модели:** поместите файлы моделей в `/DATA/AppData/comfyui_nvidia/models` (например, `checkpoints/`, `loras/`, `vae/`) и обновите список моделей в веб-интерфейсе.

      **Подробнее:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker-образ](https://github.com/YanWenKun/ComfyUI-Docker)
    sv_SE: |-
      ComfyUI är ett kraftfullt, modulärt, nodbaserat gränssnitt för generativ AI. Bygg pipelines för bild-, video- och ljudgenerering visuellt som grafer, återanvänd communityns arbetsflöden och utöka allt med egna noder.

      **Denna utgåva:** accelereras på NVIDIA-GPU:er via CUDA 12.6, med 40+ populära egna noder och prestandabibliotek. Kräver NVIDIA-drivrutin och nvidia-container-toolkit på värden.

      **Modeller:** lägg modellfiler under `/DATA/AppData/comfyui_nvidia/models` (t.ex. `checkpoints/`, `loras/`, `vae/`) och uppdatera modellistan i webbgränssnittet.

      **Läs mer:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker-avbildning](https://github.com/YanWenKun/ComfyUI-Docker)
    tr_TR: |-
      ComfyUI, üretken yapay zekâ için güçlü, modüler, düğüm tabanlı bir arayüzdür. Görüntü, video ve ses üretim hatlarını graf olarak görsel şekilde kurun, topluluk iş akışlarını yeniden kullanın ve her şeyi özel düğümlerle genişletin.

      **Bu sürüm:** CUDA 12.6 aracılığıyla NVIDIA GPU'larda hızlandırılır; 40'tan fazla popüler özel düğüm ve performans kütüphanesiyle birlikte gelir. Ana makinede NVIDIA sürücüsü ve nvidia-container-toolkit gerektirir.

      **Modeller:** model dosyalarını `/DATA/AppData/comfyui_nvidia/models` altına koyun (örn. `checkpoints/`, `loras/`, `vae/`), ardından web arayüzünde model listesini yenileyin.

      **Daha fazla bilgi:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker imajı](https://github.com/YanWenKun/ComfyUI-Docker)
    zh_CN: |-
      ComfyUI 是强大、模块化的节点式生成式 AI 界面。以图形化节点搭建图像、视频、音频生成流水线,复用社区工作流,并可通过自定义节点无限扩展。

      **本版本:**通过 CUDA 12.6 在 NVIDIA GPU 上加速,内置 40+ 个热门自定义节点与性能库。需要宿主机安装 NVIDIA 驱动与 nvidia-container-toolkit。

      **模型:**将模型文件放入 `/DATA/AppData/comfyui_nvidia/models`(如 `checkpoints/`、`loras/`、`vae/`),然后在 Web 界面刷新模型列表。

      **了解更多:**[ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker 镜像](https://github.com/YanWenKun/ComfyUI-Docker)
