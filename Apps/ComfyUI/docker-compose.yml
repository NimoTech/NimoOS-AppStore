    hr_HR: Najmoćnije open-source sučelje za generativni AI temeljeno na čvorovima
    it_IT: La più potente interfaccia open source a nodi per l'IA generativa
    ja_JP: 最も強力なオープンソースのノードベース生成AIインターフェース
    ko_KR: 가장 강력한 오픈소스 노드 기반 생성형 AI 인터페이스
    nb_NO: Det kraftigste åpen kildekode, nodebaserte grensesnittet for generativ KI
    pt_PT: A interface nodal open source mais poderosa para IA generativa
    ru_RU: Самый мощный открытый узловой интерфейс для генеративного ИИ
    sv_SE: Det kraftfullaste nodbaserade gränssnittet med öppen källkod för generativ AI
    tr_TR: Üretken yapay zekâ için en güçlü açık kaynaklı, düğüm tabanlı arayüz
    zh_CN: 最强大的开源节点式生成式 AI 工作流界面
  description:
    de_DE: |-
      ComfyUI ist eine leistungsstarke, modulare, knotenbasierte Oberfläche für generative KI. Erstellen Sie Bild-, Video- und Audio-Pipelines visuell als Graphen, nutzen Sie Community-Workflows und erweitern Sie alles mit Custom Nodes.

      **Diese Edition:** läuft vollständig auf der CPU — funktioniert auf jedem x86-Rechner ohne GPU. Die Generierung ist langsam (ideal zum Ausprobieren und für leichte Workflows).

      **Modelle:** Modelldateien unter `/DATA/AppData/comfyui/models` ablegen (z. B. `checkpoints/`, `loras/`, `vae/`) und die Modellliste in der Web-UI aktualisieren.

      **Mehr erfahren:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker-Image](https://github.com/YanWenKun/ComfyUI-Docker)
    el_GR: |-
      Το ComfyUI είναι μια ισχυρή, αρθρωτή διεπαφή γενετικής AI βασισμένη σε κόμβους. Δημιουργήστε ροές παραγωγής εικόνας, βίντεο και ήχου οπτικά ως γράφους, επαναχρησιμοποιήστε workflows της κοινότητας και επεκτείνετε τα πάντα με custom nodes.

      **Αυτή η έκδοση:** εκτελείται πλήρως σε CPU — λειτουργεί σε οποιοδήποτε x86 μηχάνημα χωρίς GPU. Η παραγωγή είναι αργή (ιδανικό για δοκιμές και ελαφριές ροές).

      **Μοντέλα:** τοποθετήστε τα αρχεία μοντέλων στο `/DATA/AppData/comfyui/models` (π.χ. `checkpoints/`, `loras/`, `vae/`) και ανανεώστε τη λίστα μοντέλων στο web UI.

      **Μάθετε περισσότερα:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker image](https://github.com/YanWenKun/ComfyUI-Docker)
    en_GB: |-
      ComfyUI is a powerful, modular, node-based interface for generative AI. Build image, video and audio generation pipelines visually as graphs, reuse community workflows, and extend everything with custom nodes.

      **This edition:** runs fully on CPU — works on any x86 machine, no GPU required. Generation is slow (best for trying things out and light workflows).

      **Models:** put model files under `/DATA/AppData/comfyui/models` (e.g. `checkpoints/`, `loras/`, `vae/`), then refresh the model list in the web UI.

      **Learn more:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker image](https://github.com/YanWenKun/ComfyUI-Docker)
    en_US: |-
      ComfyUI is a powerful, modular, node-based interface for generative AI. Build image, video and audio generation pipelines visually as graphs, reuse community workflows, and extend everything with custom nodes.

      **This edition:** runs fully on CPU — works on any x86 machine, no GPU required. Generation is slow (best for trying things out and light workflows).

      **Models:** put model files under `/DATA/AppData/comfyui/models` (e.g. `checkpoints/`, `loras/`, `vae/`), then refresh the model list in the web UI.

      **Learn more:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker image](https://github.com/YanWenKun/ComfyUI-Docker)
    fr_FR: |-
      ComfyUI est une interface nodale puissante et modulaire pour l'IA générative. Construisez visuellement des pipelines d'images, de vidéo et d'audio sous forme de graphes, réutilisez les workflows de la communauté et étendez tout avec des custom nodes.

      **Cette édition :** fonctionne entièrement sur CPU — sur n'importe quelle machine x86, sans GPU. La génération est lente (idéal pour découvrir et pour les workflows légers).

      **Modèles :** placez les fichiers de modèles dans `/DATA/AppData/comfyui/models` (p. ex. `checkpoints/`, `loras/`, `vae/`), puis actualisez la liste des modèles dans l'interface web.

      **En savoir plus :** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Image Docker](https://github.com/YanWenKun/ComfyUI-Docker)
    hr_HR: |-
      ComfyUI je moćno, modularno sučelje za generativni AI temeljeno na čvorovima. Vizualno gradite cjevovode za generiranje slika, videa i zvuka kao grafove, koristite workflowove zajednice i proširujte sve custom čvorovima.

      **Ovo izdanje:** radi u potpunosti na CPU-u — na bilo kojem x86 računalu bez GPU-a. Generiranje je sporo (najbolje za isprobavanje i lagane workflowove).

      **Modeli:** datoteke modela stavite u `/DATA/AppData/comfyui/models` (npr. `checkpoints/`, `loras/`, `vae/`), zatim osvježite popis modela u web sučelju.

      **Saznajte više:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker slika](https://github.com/YanWenKun/ComfyUI-Docker)
    it_IT: |-
      ComfyUI è un'interfaccia a nodi potente e modulare per l'IA generativa. Costruisci visivamente pipeline di generazione di immagini, video e audio come grafi, riutilizza i workflow della community ed estendi tutto con custom node.

      **Questa edizione:** funziona interamente su CPU — su qualsiasi macchina x86, senza GPU. La generazione è lenta (ideale per provare e per workflow leggeri).

      **Modelli:** metti i file dei modelli in `/DATA/AppData/comfyui/models` (es. `checkpoints/`, `loras/`, `vae/`), poi aggiorna l'elenco modelli nella web UI.

      **Scopri di più:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Immagine Docker](https://github.com/YanWenKun/ComfyUI-Docker)
    ja_JP: |-
      ComfyUIは、強力でモジュール式のノードベース生成AIインターフェースです。画像・動画・音声の生成パイプラインをグラフとして視覚的に構築し、コミュニティのワークフローを再利用し、カスタムノードで自由に拡張できます。

      **このエディション:**完全にCPUで動作 —— GPUなしのx86マシンでも使えます。生成は遅めです(お試しや軽いワークフロー向け)。

      **モデル:**モデルファイルを `/DATA/AppData/comfyui/models`(例:`checkpoints/`、`loras/`、`vae/`)に配置し、Web UIでモデルリストを更新してください。

      **詳細:**[ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Dockerイメージ](https://github.com/YanWenKun/ComfyUI-Docker)
    ko_KR: |-
      ComfyUI는 강력하고 모듈화된 노드 기반 생성형 AI 인터페이스입니다. 이미지·비디오·오디오 생성 파이프라인을 그래프로 시각적으로 구성하고, 커뮤니티 워크플로를 재사용하며, 커스텀 노드로 무한히 확장할 수 있습니다.

      **이 에디션:** CPU만으로 완전히 동작 — GPU 없는 모든 x86 머신에서 사용 가능합니다. 생성 속도는 느립니다(체험 및 가벼운 워크플로에 적합).

      **모델:** 모델 파일을 `/DATA/AppData/comfyui/models`(예: `checkpoints/`, `loras/`, `vae/`)에 넣고 웹 UI에서 모델 목록을 새로고침하세요.

      **자세히 알아보기:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker 이미지](https://github.com/YanWenKun/ComfyUI-Docker)
    nb_NO: |-
      ComfyUI er et kraftig, modulært, nodebasert grensesnitt for generativ KI. Bygg pipeline for bilde-, video- og lydgenerering visuelt som grafer, gjenbruk fellesskapets arbeidsflyter og utvid alt med egendefinerte noder.

      **Denne utgaven:** kjører helt på CPU — fungerer på alle x86-maskiner uten GPU. Genereringen er treg (best for utprøving og lette arbeidsflyter).

      **Modeller:** legg modellfiler under `/DATA/AppData/comfyui/models` (f.eks. `checkpoints/`, `loras/`, `vae/`), og oppdater modellisten i web-UI.

      **Les mer:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker-bilde](https://github.com/YanWenKun/ComfyUI-Docker)
    pt_PT: |-
      O ComfyUI é uma interface nodal poderosa e modular para IA generativa. Construa visualmente pipelines de geração de imagem, vídeo e áudio como grafos, reutilize workflows da comunidade e estenda tudo com custom nodes.

      **Esta edição:** funciona inteiramente em CPU — em qualquer máquina x86, sem GPU. A geração é lenta (ideal para experimentar e workflows leves).

      **Modelos:** coloque os ficheiros de modelos em `/DATA/AppData/comfyui/models` (p. ex. `checkpoints/`, `loras/`, `vae/`) e atualize a lista de modelos na interface web.

      **Saiba mais:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Imagem Docker](https://github.com/YanWenKun/ComfyUI-Docker)
    ru_RU: |-
      ComfyUI — мощный модульный узловой интерфейс для генеративного ИИ. Визуально собирайте конвейеры генерации изображений, видео и звука в виде графов, используйте готовые workflow сообщества и расширяйте всё пользовательскими узлами.

      **Эта редакция:** работает полностью на CPU — на любой машине x86 без GPU. Генерация медленная (подходит для знакомства и лёгких workflow).

      **Модели:** поместите файлы моделей в `/DATA/AppData/comfyui/models` (например, `checkpoints/`, `loras/`, `vae/`) и обновите список моделей в веб-интерфейсе.

      **Подробнее:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker-образ](https://github.com/YanWenKun/ComfyUI-Docker)
    sv_SE: |-
      ComfyUI är ett kraftfullt, modulärt, nodbaserat gränssnitt för generativ AI. Bygg pipelines för bild-, video- och ljudgenerering visuellt som grafer, återanvänd communityns arbetsflöden och utöka allt med egna noder.

      **Denna utgåva:** körs helt på CPU — fungerar på alla x86-maskiner utan GPU. Genereringen är långsam (bäst för att prova på och lätta arbetsflöden).

      **Modeller:** lägg modellfiler under `/DATA/AppData/comfyui/models` (t.ex. `checkpoints/`, `loras/`, `vae/`) och uppdatera modellistan i webbgränssnittet.

      **Läs mer:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker-avbildning](https://github.com/YanWenKun/ComfyUI-Docker)
    tr_TR: |-
      ComfyUI, üretken yapay zekâ için güçlü, modüler, düğüm tabanlı bir arayüzdür. Görüntü, video ve ses üretim hatlarını graf olarak görsel şekilde kurun, topluluk iş akışlarını yeniden kullanın ve her şeyi özel düğümlerle genişletin.

      **Bu sürüm:** tamamen CPU üzerinde çalışır — GPU gerektirmeden her x86 makinede kullanılabilir. Üretim yavaştır (deneme ve hafif iş akışları için idealdir).

      **Modeller:** model dosyalarını `/DATA/AppData/comfyui/models` altına koyun (örn. `checkpoints/`, `loras/`, `vae/`), ardından web arayüzünde model listesini yenileyin.

      **Daha fazla bilgi:** [ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker imajı](https://github.com/YanWenKun/ComfyUI-Docker)
    zh_CN: |-
      ComfyUI 是强大、模块化的节点式生成式 AI 界面。以图形化节点搭建图像、视频、音频生成流水线,复用社区工作流,并可通过自定义节点无限扩展。

      **本版本:**纯 CPU 运行 —— 任何 x86 机器无需 GPU 即可使用。生成速度较慢(适合尝鲜和轻量工作流)。

      **模型:**将模型文件放入 `/DATA/AppData/comfyui/models`(如 `checkpoints/`、`loras/`、`vae/`),然后在 Web 界面刷新模型列表。

      **了解更多:**[ComfyUI](https://github.com/comfyanonymous/ComfyUI) · [Docker 镜像](https://github.com/YanWenKun/ComfyUI-Docker)
  tips:
    before_install:
      de_DE: |-
        1. Der erste Start initialisiert die Python-Umgebung und lädt ggf. Komponenten herunter — bitte einige Minuten warten, bevor Sie die Web-UI öffnen.
        2. Modelldateien gehören unter `/DATA/AppData/comfyui/models` — z. B. Stable-Diffusion-Checkpoints nach `checkpoints/`, LoRAs nach `loras/`, VAEs nach `vae/`. Danach die Modellliste in der UI aktualisieren.
        3. Keine GPU erforderlich. Auf der CPU dauert ein Bild mehrere Minuten.
      el_GR: |-
        1. Η πρώτη εκκίνηση αρχικοποιεί το περιβάλλον Python και ενδέχεται να κατεβάσει στοιχεία — περιμένετε μερικά λεπτά πριν ανοίξετε το web UI.
        2. Τα αρχεία μοντέλων πηγαίνουν στο `/DATA/AppData/comfyui/models` — π.χ. checkpoints στο `checkpoints/`, LoRA στο `loras/`, VAE στο `vae/`. Μετά ανανεώστε τη λίστα μοντέλων στο UI.
        3. Δεν απαιτείται GPU. Στη CPU κάθε εικόνα θέλει αρκετά λεπτά.
      en_GB: |-
        1. The first start initializes the Python environment and may download components — give it a few minutes before opening the web UI.
        2. Model files go under `/DATA/AppData/comfyui/models` — e.g. Stable Diffusion checkpoints into `checkpoints/`, LoRAs into `loras/`, VAEs into `vae/`. Refresh the model list in the UI after copying.
        3. No GPU required. Expect minutes per image on CPU.
      en_US: |-
        1. The first start initializes the Python environment and may download components — give it a few minutes before opening the web UI.
        2. Model files go under `/DATA/AppData/comfyui/models` — e.g. Stable Diffusion checkpoints into `checkpoints/`, LoRAs into `loras/`, VAEs into `vae/`. Refresh the model list in the UI after copying.
        3. No GPU required. Expect minutes per image on CPU.
      fr_FR: |-
        1. Le premier démarrage initialise l'environnement Python et peut télécharger des composants — patientez quelques minutes avant d'ouvrir l'interface web.
        2. Les fichiers de modèles vont dans `/DATA/AppData/comfyui/models` — p. ex. les checkpoints Stable Diffusion dans `checkpoints/`, les LoRA dans `loras/`, les VAE dans `vae/`. Actualisez ensuite la liste des modèles dans l'interface.
