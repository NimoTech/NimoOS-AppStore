name: comfyui
services:
  comfyui:
    image: ghcr.io/nimotech/comfyui:cpu-20260803
    container_name: comfyui
    environment:
      CLI_ARGS: --cpu
    ports:
    - target: 8188
      published: '8188'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/storage
      target: /root
    - type: bind
      source: /DATA/AppData/$AppID/models
      target: /root/ComfyUI/models
    - type: bind
      source: /DATA/AppData/$AppID/input
      target: /root/ComfyUI/input
    - type: bind
      source: /DATA/AppData/$AppID/output
      target: /root/ComfyUI/output
    restart: unless-stopped
    x-casaos:
      envs:
      - container: CLI_ARGS
        description:
          de_DE: Zusätzliche ComfyUI-Startargumente
          el_GR: Πρόσθετα ορίσματα εκκίνησης ComfyUI
          en_GB: Extra ComfyUI launch arguments
          en_US: Extra ComfyUI launch arguments
          fr_FR: Arguments de lancement ComfyUI supplémentaires
          hr_HR: Dodatni argumenti pokretanja ComfyUI
          it_IT: Argomenti di avvio ComfyUI aggiuntivi
          ja_JP: ComfyUIの追加起動引数
          ko_KR: ComfyUI 추가 실행 인수
          nb_NO: Ekstra ComfyUI-oppstartsargumenter
          pt_PT: Argumentos de arranque adicionais do ComfyUI
          ru_RU: Дополнительные аргументы запуска ComfyUI
          sv_SE: Extra ComfyUI-startargument
          tr_TR: Ek ComfyUI başlatma argümanları
          zh_CN: ComfyUI 额外启动参数
      ports:
      - container: '8188'
        description:
          de_DE: ComfyUI Web-UI-Port
          el_GR: Θύρα web διεπαφής ComfyUI
          en_GB: ComfyUI web interface port
          en_US: ComfyUI web interface port
          fr_FR: Port de l'interface web ComfyUI
          hr_HR: Port web sučelja ComfyUI
          it_IT: Porta dell'interfaccia web ComfyUI
          ja_JP: ComfyUI Webインターフェースポート
          ko_KR: ComfyUI 웹 인터페이스 포트
          nb_NO: ComfyUI web-grensesnittport
          pt_PT: Porta da interface web ComfyUI
          ru_RU: Порт веб-интерфейса ComfyUI
          sv_SE: ComfyUI webbgränssnittsport
          tr_TR: ComfyUI web arayüzü portu
          zh_CN: ComfyUI Web 界面端口
      volumes:
      - container: /root
        description:
          de_DE: Anwendungsspeicher (ComfyUI-Umgebung, Custom Nodes, Einstellungen)
          el_GR: Αποθήκευση εφαρμογής (περιβάλλον ComfyUI, custom nodes, ρυθμίσεις)
          en_GB: Application storage (ComfyUI environment, custom nodes, settings)
          en_US: Application storage (ComfyUI environment, custom nodes, settings)
          fr_FR: Stockage de l'application (environnement ComfyUI, custom nodes, réglages)
          hr_HR: Pohrana aplikacije (ComfyUI okruženje, custom čvorovi, postavke)
          it_IT: Spazio dell'applicazione (ambiente ComfyUI, custom node, impostazioni)
          ja_JP: アプリケーションストレージ(ComfyUI環境、カスタムノード、設定)
          ko_KR: 애플리케이션 저장소(ComfyUI 환경, 커스텀 노드, 설정)
          nb_NO: Applikasjonslagring (ComfyUI-miljø, egendefinerte noder, innstillinger)
          pt_PT: Armazenamento da aplicação (ambiente ComfyUI, custom nodes, definições)
          ru_RU: Хранилище приложения (окружение ComfyUI, пользовательские узлы, настройки)
          sv_SE: Programlagring (ComfyUI-miljö, egna noder, inställningar)
          tr_TR: Uygulama depolama alanı (ComfyUI ortamı, özel düğümler, ayarlar)
          zh_CN: 应用存储(ComfyUI 环境、自定义节点、设置)
      - container: /root/ComfyUI/models
        description:
          de_DE: Modelldateien (Checkpoints, LoRAs, VAE, Upscaler)
          el_GR: Αρχεία μοντέλων (checkpoints, LoRA, VAE, upscalers)
          en_GB: Model files (checkpoints, LoRAs, VAE, upscalers)
          en_US: Model files (checkpoints, LoRAs, VAE, upscalers)
          fr_FR: Fichiers de modèles (checkpoints, LoRA, VAE, upscalers)
          hr_HR: Datoteke modela (checkpointovi, LoRA, VAE, upscaleri)
          it_IT: File dei modelli (checkpoint, LoRA, VAE, upscaler)
          ja_JP: モデルファイル(チェックポイント、LoRA、VAE、アップスケーラー)
          ko_KR: 모델 파일(체크포인트, LoRA, VAE, 업스케일러)
          nb_NO: Modellfiler (checkpoints, LoRA-er, VAE, oppskalere)
          pt_PT: Ficheiros de modelos (checkpoints, LoRAs, VAE, upscalers)
          ru_RU: Файлы моделей (чекпоинты, LoRA, VAE, апскейлеры)
          sv_SE: Modellfiler (checkpoints, LoRA, VAE, uppskalare)
          tr_TR: Model dosyaları (checkpoint'ler, LoRA'lar, VAE, upscaler'lar)
          zh_CN: 模型文件(底模、LoRA、VAE、放大模型)
      - container: /root/ComfyUI/input
        description:
          de_DE: Eingabebilder und -dateien
          el_GR: Εικόνες και αρχεία εισόδου
          en_GB: Input images and files
          en_US: Input images and files
          fr_FR: Images et fichiers d'entrée
          hr_HR: Ulazne slike i datoteke
          it_IT: Immagini e file di input
          ja_JP: 入力画像とファイル
          ko_KR: 입력 이미지 및 파일
          nb_NO: Inndatabilder og -filer
          pt_PT: Imagens e ficheiros de entrada
          ru_RU: Входные изображения и файлы
          sv_SE: Indatabilder och -filer
          tr_TR: Girdi görüntüleri ve dosyaları
          zh_CN: 输入图片与文件
      - container: /root/ComfyUI/output
        description:
          de_DE: Generierte Bilder und Videos
          el_GR: Παραγόμενες εικόνες και βίντεο
          en_GB: Generated images and videos
          en_US: Generated images and videos
          fr_FR: Images et vidéos générées
          hr_HR: Generirane slike i videozapisi
          it_IT: Immagini e video generati
          ja_JP: 生成された画像と動画
          ko_KR: 생성된 이미지와 비디오
          nb_NO: Genererte bilder og videoer
          pt_PT: Imagens e vídeos gerados
          ru_RU: Сгенерированные изображения и видео
          sv_SE: Genererade bilder och videor
          tr_TR: Oluşturulan görüntüler ve videolar
          zh_CN: 生成的图片与视频
