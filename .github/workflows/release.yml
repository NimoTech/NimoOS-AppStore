name: release

on:
  push:
    tags:
      - v*.*.*

jobs:
  build:
    if: github.repository == 'NimoTech/NimoOS-AppStore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: remove all screenshots
        run: find . -iname "screenshot*" | xargs rm -f
      - name: remove all thumbnails
        run: find . -iname "thumbnail*" | xargs rm -f
      - name: remove all icon
        run: find . -iname "icon.png" | xargs rm -f
      - name: remove all app file
        run: find . -iname "appfile.json" | xargs rm -f
        
      - name: create a build with sysroot
        id: build
        run: |
          rm -rf /tmp/build
          mkdir -p /tmp/build/sysroot/var/lib/nimoos/appstore/default.new
          cp -rv build/* /tmp/build/
          cp -rv Apps /tmp/build/sysroot/var/lib/nimoos/appstore/default.new/
          cp -v category-list.json /tmp/build/sysroot/var/lib/nimoos/appstore/default.new/
          cp -v recommend-list.json /tmp/build/sysroot/var/lib/nimoos/appstore/default.new/
          cp -v README.md /tmp/build/sysroot/var/lib/nimoos/appstore/default.new/
          pushd /tmp
          tar zcvf linux-all-appstore-${{ github.ref_name }}.tar.gz build
      
      - uses: softprops/action-gh-release@v1
        if: steps.build.outcome == 'success'
        with:
          files: /tmp/linux-all-appstore-${{ github.ref_name }}.tar.gz
          draft: true
          prerelease: true
          fail_on_unmatched_files: true

      - name: Get version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}
      
      # The Aliyun upload this replaces keyed its objects under
      # /IceWhaleTech/CasaOS-AppStore/releases/download/... — upstream's path, in a
      # bucket named casaos. Artifact distribution moved to S3; the GitHub release
      # above is the record, and release_zip.yml publishes the store payload.
