name: validate docker compose file

on:
    pull_request:
      types: [opened, synchronize]
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Manifests name their artwork by URL, and those URLs are only good if the
      # file is committed here for the S3 sync to publish. Nothing checked that,
      # and four different ways of getting it wrong had all reached main.
      - name: Check every referenced icon and screenshot exists
        run: python3 check_artwork.py

      - uses: robinraju/release-downloader@v1.9
        with:
          repository: "NimoTech/NimoOS-AppManagement"
          latest: true
          fileName: "linux-amd64-nimoos-app-management-validator-*.tar.gz"

      - name: Extract
        run: |
            tar zxf linux-amd64-nimoos-app-management-validator-*.tar.gz

      - name: Install
        run: |
            chmod +x build/sysroot/usr/bin/nimoos-app-management-validator

      - name: Check All Docker Compose File
        id: validate_docker_compose
        run: |
            find . -type f \( -name "docker-compose.yaml" -or -name "docker-compose.yml" \) | while read -r file; do
              echo $file
              build/sysroot/usr/bin/nimoos-app-management-validator $file
            done
