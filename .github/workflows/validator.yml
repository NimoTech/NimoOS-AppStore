name: validate docker compose file

on:
    pull_request:
      types: [opened, synchronize]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: NimoOS-AppStore

      # Manifests name their artwork by URL, and those URLs are only good if the
      # file is committed here for the S3 sync to publish. Nothing checked that,
      # and four different ways of getting it wrong had all reached main.
      - name: Check every referenced icon and screenshot exists
        working-directory: NimoOS-AppStore
        run: python3 check_artwork.py

      # The validator used to be downloaded from NimoTech/NimoOS-AppManagement's
      # latest release. That repository has never published one — upstream did,
      # this fork does not — so the step failed with
      #   [getlatestRelease] Unexpected response: 404
      # on every run. Nobody knew, because Actions was disabled org-wide until
      # now and this workflow had therefore never executed.
      #
      # Building from source removes the dependency on a release that may never
      # exist, and checks manifests against the validator as it is today rather
      # than as of whenever one was last shipped.
      #
      # One checkout is enough. This used to clone NimoOS-Common and
      # NimoOS-MessageBus too, because AppManagement's go.mod redirected
      # NimoOS-Common to ../NimoOS-Common and its go:generate read
      # ../NimoOS-MessageBus's spec. AppManagement builds standalone now.
      #
      # No token either: NimoOS-AppManagement is public, so the default job
      # token can read it. That is what makes this work on pull requests from
      # forks, which never receive repository secrets.
      - name: Check out NimoOS-AppManagement
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NimoTech/NimoOS-AppManagement
          path: NimoOS-AppManagement

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: NimoOS-AppManagement/go.mod
          cache-dependency-path: NimoOS-AppManagement/go.sum

      # No go generate step: AppManagement commits its generated code now, so a
      # fresh clone compiles as-is.
      - name: Build the validator
        working-directory: NimoOS-AppManagement
        env:
          CGO_ENABLED: "0"
        run: go build -o "$RUNNER_TEMP/nimoos-app-management-validator" ./cmd/validator

      # The loop this replaces piped find into `while read` and never looked at
      # the validator's exit code, so a manifest that failed validation still
      # left the job green. It could report success but never failure.
      - name: Check all docker compose files
        working-directory: NimoOS-AppStore
        run: |
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! "$RUNNER_TEMP/nimoos-app-management-validator" "$file"; then
              echo "::error file=$file::failed docker-compose validation"
              failed=$((failed + 1))
            fi
          done < <(find . -type f \( -name "docker-compose.yaml" -o -name "docker-compose.yml" \) -print0)
          echo "validated $count manifests, $failed failed"
          if [ "$count" -eq 0 ]; then
            echo "::error::found no manifests to validate — has the layout changed?"
            exit 1
          fi
          [ "$failed" -eq 0 ]
